name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate sideload signing key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/sideload.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass sideload \
            -keypass sideload \
            -alias mcr \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MCR PDF Studio, OU=Sideload, O=MCR, C=US"
          echo "MCR_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "MCR_KEYSTORE_PASSWORD=sideload" >> "$GITHUB_ENV"
          echo "MCR_KEY_ALIAS=mcr" >> "$GITHUB_ENV"
          echo "MCR_KEY_PASSWORD=sideload" >> "$GITHUB_ENV"

      - name: Fetch bundled fonts and OCR data
        run: ./scripts/fetch-assets.sh

      - name: Build release APK and run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease 2>&1 \
            | tee "$RUNNER_TEMP/build.log"

      # Publishes the compiler diagnostics as an annotated tag, so failures can
      # be read with `git fetch` instead of trawling the Actions log UI.
      - name: Report build failure
        if: failure()
        run: |
          set +e
          {
            echo "Build failed for ${GITHUB_SHA:0:7}"
            echo
            grep -E "^e: |error:|FAILED|Test .* failed" "$RUNNER_TEMP/build.log" | head -60
            echo
            sed -n '/What went wrong/,/^\* Try/p' "$RUNNER_TEMP/build.log" | head -30
          } > "$RUNNER_TEMP/diag.txt"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f -a ci-status -F "$RUNNER_TEMP/diag.txt"
          git push -f origin refs/tags/ci-status

      - name: Stage APK
        id: stage
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/mcr-pdf-studio.apk"
          ls -lh dist/
          echo "apk=dist/mcr-pdf-studio.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "${{ steps.stage.outputs.apk }}"
          "$BT/aapt2" dump badging "${{ steps.stage.outputs.apk }}" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcr-pdf-studio-apk
          path: dist/mcr-pdf-studio.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest"
          NOTES="Sideload build of MCR PDF Studio from commit ${GITHUB_SHA:0:7}.

          Install on Android: download the APK below, tap it, and allow
          installation from your browser or file manager when prompted.

          Note: each CI build is signed with a freshly generated sideload key,
          so if Android refuses to install over an older build, uninstall the
          previous version first."

          # Recreate rather than update, so the tag always points at the commit
          # that produced the APK and no stale asset survives.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "${{ steps.stage.outputs.apk }}" \
            --target "$GITHUB_SHA" \
            --title "MCR PDF Studio (latest)" \
            --notes "$NOTES" \
            --prerelease

      - name: Report build success
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Build OK for ${GITHUB_SHA:0:7}" > "$RUNNER_TEMP/ok.txt"
          git tag -f -a ci-status -F "$RUNNER_TEMP/ok.txt"
          git push -f origin refs/tags/ci-status

  # Runs the real engine on a headless emulator Gradle manages itself. Kept
  # separate from the build so a slow or flaky device never blocks the release.
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch bundled fonts and OCR data
        run: ./scripts/fetch-assets.sh

      - name: Run engine tests on device
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDeviceDebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            2>&1 | tee "$RUNNER_TEMP/device.log"

      - name: Publish test results
        if: always()
        run: |
          set +e
          if grep -q "BUILD SUCCESSFUL" "$RUNNER_TEMP/device.log"; then
            PASSED=$(grep -oE "[0-9]+ tests? (passed|completed)" "$RUNNER_TEMP/device.log" | tail -1)
            echo "Device tests OK for ${GITHUB_SHA:0:7} ${PASSED}" > "$RUNNER_TEMP/t.txt"
          else
            {
              echo "Device tests FAILED for ${GITHUB_SHA:0:7}"
              echo
              grep -E "FAILED|AssertionError|expected:|Caused by|^e: " \
                "$RUNNER_TEMP/device.log" | head -30
              echo
              sed -n '/What went wrong/,/^\* Try/p' "$RUNNER_TEMP/device.log" | head -25
              echo
              tail -25 "$RUNNER_TEMP/device.log"
            } > "$RUNNER_TEMP/t.txt"
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f -a ci-tests -F "$RUNNER_TEMP/t.txt"
          git push -f origin refs/tags/ci-tests

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
