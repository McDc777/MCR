name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate sideload signing key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/sideload.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass sideload \
            -keypass sideload \
            -alias mcr \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MCR PDF Studio, OU=Sideload, O=MCR, C=US"
          echo "MCR_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "MCR_KEYSTORE_PASSWORD=sideload" >> "$GITHUB_ENV"
          echo "MCR_KEY_ALIAS=mcr" >> "$GITHUB_ENV"
          echo "MCR_KEY_PASSWORD=sideload" >> "$GITHUB_ENV"

      # Bundling fonts guarantees every script renders even on devices that ship
      # a thin font set. They are fetched here rather than committed so the repo
      # stays text-only; the app falls back to system fonts if any are missing.
      - name: Fetch bundled fonts
        run: |
          set -uo pipefail
          DEST=app/src/main/assets/fonts
          mkdir -p "$DEST"

          FAMILIES="
          NotoSans/NotoSans-Regular
          NotoSans/NotoSans-Bold
          NotoSerif/NotoSerif-Regular
          NotoNaskhArabic/NotoNaskhArabic-Regular
          NotoSansHebrew/NotoSansHebrew-Regular
          NotoSansDevanagari/NotoSansDevanagari-Regular
          NotoSansBengali/NotoSansBengali-Regular
          NotoSansTamil/NotoSansTamil-Regular
          NotoSansTelugu/NotoSansTelugu-Regular
          NotoSansKannada/NotoSansKannada-Regular
          NotoSansMalayalam/NotoSansMalayalam-Regular
          NotoSansGujarati/NotoSansGujarati-Regular
          NotoSansGurmukhi/NotoSansGurmukhi-Regular
          NotoSansSinhala/NotoSansSinhala-Regular
          NotoSansThai/NotoSansThai-Regular
          NotoSansLao/NotoSansLao-Regular
          NotoSansKhmer/NotoSansKhmer-Regular
          NotoSansMyanmar/NotoSansMyanmar-Regular
          NotoSansEthiopic/NotoSansEthiopic-Regular
          NotoSansGeorgian/NotoSansGeorgian-Regular
          NotoSansArmenian/NotoSansArmenian-Regular
          NotoSansThaana/NotoSansThaana-Regular
          NotoSansCherokee/NotoSansCherokee-Regular
          NotoSansMongolian/NotoSansMongolian-Regular
          NotoSansTifinagh/NotoSansTifinagh-Regular
          "

          ok=0; missing=""
          for entry in $FAMILIES; do
            family="${entry%%/*}"
            file="${entry##*/}.ttf"
            gh_url="https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/$family/hinted/ttf/$file"
            cdn_url="https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io@main/fonts/$family/hinted/ttf/$file"
            if curl -fsSL --retry 3 --max-time 90 -o "$DEST/$file" "$gh_url" \
              || curl -fsSL --retry 3 --max-time 90 -o "$DEST/$file" "$cdn_url"; then
              ok=$((ok + 1))
            else
              rm -f "$DEST/$file"
              missing="$missing $file"
            fi
          done

          echo "Bundled $ok font(s)."
          [ -n "$missing" ] && echo "Unavailable (system fonts will cover these):$missing"
          du -sh "$DEST" || true
          # The app degrades to device fonts, so a partial fetch is not fatal —
          # but a total failure means something is wrong with the source.
          if [ "$ok" -eq 0 ]; then
            echo "No fonts could be fetched" >&2
            exit 1
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 \
            | tee "$RUNNER_TEMP/build.log"

      # Publishes the compiler diagnostics as an annotated tag, so failures can
      # be read with `git fetch` instead of trawling the Actions log UI.
      - name: Report build failure
        if: failure()
        run: |
          set +e
          {
            echo "Build failed for ${GITHUB_SHA:0:7}"
            echo
            grep -E "^e: |^w: warning: |error:" "$RUNNER_TEMP/build.log" | head -60
            echo
            sed -n '/What went wrong/,/^\* Try/p' "$RUNNER_TEMP/build.log" | head -30
          } > "$RUNNER_TEMP/diag.txt"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f -a ci-status -F "$RUNNER_TEMP/diag.txt"
          git push -f origin refs/tags/ci-status

      - name: Stage APK
        id: stage
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/mcr-pdf-studio.apk"
          ls -lh dist/
          echo "apk=dist/mcr-pdf-studio.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "${{ steps.stage.outputs.apk }}"
          "$BT/aapt2" dump badging "${{ steps.stage.outputs.apk }}" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcr-pdf-studio-apk
          path: dist/mcr-pdf-studio.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest"
          NOTES="Sideload build of MCR PDF Studio from commit ${GITHUB_SHA:0:7}.

          Install on Android: download the APK below, tap it, and allow
          installation from your browser or file manager when prompted.

          Note: each CI build is signed with a freshly generated sideload key,
          so if Android refuses to install over an older build, uninstall the
          previous version first."

          # Recreate rather than update, so the tag always points at the commit
          # that produced the APK and no stale asset survives.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "${{ steps.stage.outputs.apk }}" \
            --target "$GITHUB_SHA" \
            --title "MCR PDF Studio (latest)" \
            --notes "$NOTES" \
            --prerelease

      - name: Report build success
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Build OK for ${GITHUB_SHA:0:7}" > "$RUNNER_TEMP/ok.txt"
          git tag -f -a ci-status -F "$RUNNER_TEMP/ok.txt"
          git push -f origin refs/tags/ci-status
