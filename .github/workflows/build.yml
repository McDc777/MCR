name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate sideload signing key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/sideload.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass sideload \
            -keypass sideload \
            -alias mcr \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MCR PDF Studio, OU=Sideload, O=MCR, C=US"
          echo "MCR_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "MCR_KEYSTORE_PASSWORD=sideload" >> "$GITHUB_ENV"
          echo "MCR_KEY_ALIAS=mcr" >> "$GITHUB_ENV"
          echo "MCR_KEY_PASSWORD=sideload" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Stage APK
        id: stage
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/mcr-pdf-studio.apk"
          ls -lh dist/
          echo "apk=dist/mcr-pdf-studio.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "${{ steps.stage.outputs.apk }}"
          "$BT/aapt2" dump badging "${{ steps.stage.outputs.apk }}" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcr-pdf-studio-apk
          path: dist/mcr-pdf-studio.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest"
          NOTES="Sideload build of MCR PDF Studio from commit ${GITHUB_SHA:0:7}.

          Install on Android: download the APK below, tap it, and allow
          installation from your browser/file manager when prompted.

          Note: each CI build is signed with a freshly generated sideload key,
          so if Android refuses to install over an older build, uninstall the
          previous version first."

          # Recreate rather than update, so the `latest` tag always points at
          # the commit that produced the APK and no stale asset survives.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "${{ steps.stage.outputs.apk }}" \
            --target "$GITHUB_SHA" \
            --title "MCR PDF Studio (latest)" \
            --notes "$NOTES" \
            --prerelease
